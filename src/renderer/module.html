<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DesoWorks Academy – Meine Lernbereiche</title>
  <link rel="stylesheet" href="/shell.css">
</head>
<body data-seite="areas">
  <a class="skip-link" href="#hauptinhalt">Direkt zum Inhalt springen</a>
  <header class="kopf">
    <div class="kopf-inhalt">
      <p class="kopf-marke"><img src="/brand/signet.svg" alt="" width="32" height="32"> DesoWorks Academy</p>
      <nav id="navigation" aria-label="Hauptnavigation"></nav>
    </div>
  </header>
  <main id="hauptinhalt" class="inhalt-seite" tabindex="-1">
    <h1>Meine Lernbereiche</h1>
    <p class="untertitel">Hier stehen alle Module, die auf diesem Rechner installiert sind.</p>
    <p id="lade">Lernbereiche werden gelesen …</p>
    <section class="bereich">
      <h2>Installierte Module</h2>
      <div id="liste"></div>
      <div class="zeile">
        <button type="button" id="installieren">Paketordner installieren</button>
        <a class="knopf" href="/catalog.html">Zum Modul-Katalog</a>
      </div>
    </section>
    <section class="bereich" id="ansicht" hidden>
      <h2 id="modul-titel">Modul</h2>
      <div id="inhalt"></div>
      <p id="ergebnis" role="status"></p>
    </section>
    <p id="meldung" role="status"></p>
    <p><a href="/home.html">Startseite</a> · <a href="/verwaltung.html">Daten und Updates</a></p>
  </main>
  <script src="/shell.js"></script>
  <script src="/module.js"></script>
</body>
</html>
